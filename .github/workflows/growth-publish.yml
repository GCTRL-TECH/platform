name: growth-publish

# Collects blog posts staged by the Growth Engine and commits them.
#
# The engine runs on the VPS and deliberately holds NO GitHub credential: it
# stages posts in its own database and this workflow pulls them. That keeps a
# long-lived write token off the server entirely, and puts the build gate in
# CI where it belongs.
#
# Runs hourly so a post published by the engine appears within the hour.

on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:

concurrency:
  group: growth-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch staged posts
        id: fetch
        env:
          GROWTH_API: ${{ secrets.GROWTH_API_URL }}
          GROWTH_KEY: ${{ secrets.GROWTH_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GROWTH_API:-}" ] || [ -z "${GROWTH_KEY:-}" ]; then
            echo "growth API not configured, nothing to do"
            echo "count=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Fail loudly on a bad response rather than committing an error page.
          code=$(curl -sS -o /tmp/staged.json -w '%{http_code}' --max-time 60 \
            -H "X-Growth-Key: ${GROWTH_KEY}" "${GROWTH_API}/pending?site=gctrl")
          if [ "$code" != "200" ]; then
            echo "growth API returned $code"; cat /tmp/staged.json || true; exit 1
          fi
          count=$(python3 -c 'import json;print(len(json.load(open("/tmp/staged.json")).get("posts",[])))')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "staged posts: $count"

      - name: Write markdown
        if: steps.fetch.outputs.count != '0'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          data = json.load(open("/tmp/staged.json"))
          out = pathlib.Path("services/portal/src/pages/blog/content")
          out.mkdir(parents=True, exist_ok=True)
          written = []
          for post in data.get("posts", []):
              slug = post["slug"]
              # Never let a supplied slug escape the content directory.
              if not re.fullmatch(r"[a-z0-9][a-z0-9-]{2,79}", slug):
                  print(f"skipping unsafe slug: {slug!r}"); continue
              body = post["markdown"]
              if any(d in body for d in "—–"):
                  print(f"skipping {slug}: em/en dash violates the copy rule"); continue
              (out / f"{slug}.md").write_text(body, encoding="utf-8")
              written.append(slug)
          pathlib.Path("/tmp/written.json").write_text(json.dumps(written))
          print("written:", written)
          PY

      - uses: actions/setup-node@v4
        if: steps.fetch.outputs.count != '0'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/portal/package-lock.json

      - name: Build gate
        if: steps.fetch.outputs.count != '0'
        working-directory: services/portal
        run: |
          npm ci
          npm run build

      - name: Commit and push
        if: steps.fetch.outputs.count != '0'
        id: commit
        run: |
          set -euo pipefail
          written=$(python3 -c 'import json;print(" ".join(json.load(open("/tmp/written.json"))))')
          if [ -z "$written" ]; then echo "nothing written"; exit 0; fi
          git config user.name  "growth-engine"
          git config user.email "growth-engine@users.noreply.github.com"
          git add services/portal/src/pages/blog/content services/portal/public
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          first=$(echo "$written" | awk '{print $1}')
          git commit -m "blog: ${first}" -m "Published by the Growth Engine. Slugs: ${written}"
          # Another job may have pushed while the build ran.
          git pull --rebase origin main
          git push origin main
          echo "pushed=$written" >> "$GITHUB_OUTPUT"

      - name: Confirm back to the engine
        if: steps.commit.outputs.pushed != ''
        env:
          GROWTH_API: ${{ secrets.GROWTH_API_URL }}
          GROWTH_KEY: ${{ secrets.GROWTH_API_KEY }}
        run: |
          set -euo pipefail
          for slug in ${{ steps.commit.outputs.pushed }}; do
            curl -sS --max-time 30 -X POST \
              -H "X-Growth-Key: ${GROWTH_KEY}" \
              -H 'Content-Type: application/json' \
              -d "{\"slug\":\"${slug}\",\"site\":\"gctrl\"}" \
              "${GROWTH_API}/confirm" || echo "confirm failed for ${slug}"
          done
