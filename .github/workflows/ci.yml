name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  typecheck-web:
    name: Typecheck Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: cd services/web && npm ci
      - run: cd services/web && npx tsc --noEmit

  typecheck-agent:
    name: Typecheck Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/agent/package-lock.json
      - run: cd services/agent && npm ci
      - run: cd services/agent && npx tsc --noEmit

  typecheck-license-api:
    name: Typecheck License API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/license-api/package-lock.json
      - run: cd services/license-api && npm ci
      - run: cd services/license-api && npx tsc --noEmit

  check-compose-hosts:
    name: Compose host mapping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # Fails if the installer can point a service at host.docker.internal that the
      # shipped compose files cannot resolve (Linux needs an explicit host-gateway
      # mapping) — the cause of edgeless graphs on native-Ollama Linux installs.
      - run: python3 scripts/check-compose-hosts.py

  test-agent:
    name: Test Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/agent/package-lock.json
      - run: cd services/agent && npm ci
      - run: cd services/agent && npm test
