[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gctrl"
version = "0.1.0"
description = "Ground Control (GCTRL) installer & lifecycle CLI — self-host the sovereign knowledge-graph memory layer for AI with one command."
readme = "README.md"
requires-python = ">=3.8"
license = "AGPL-3.0-or-later"
authors = [{ name = "Cinque Monti Ltd. (GCTRL)", email = "hello@gctrl.tech" }]
keywords = ["gctrl", "knowledge-graph", "rag", "self-hosted", "docker", "ai-memory"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Installation/Setup",
]
# Stdlib-only on purpose: `pip install gctrl` must never drag in a dependency
# tree that could clash with a user's environment. Docker is the only real
# prerequisite (checked at runtime, not installed by pip).
dependencies = []

[project.urls]
Homepage = "https://gctrl.tech"
Documentation = "https://gctrl.tech/docs"
Source = "https://github.com/GCTRL-TECH/platform"

[project.scripts]
gctrl = "gctrl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gctrl"]
